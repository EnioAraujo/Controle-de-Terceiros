<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Security Headers via Meta Tags (OWASP A02:2025) -->
    <!-- Content Security Policy: previne XSS e injeção de recursos -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; form-action 'self';">
    <!-- X-Frame-Options: previne clickjacking -->
    <meta http-equiv="X-Frame-Options" content="DENY">
    <!-- X-Content-Type-Options: previne MIME sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <!-- Referrer-Policy: controla informações do referrer -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <title>Controle de Terceiros</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
